name: Daily Supabase Backup & Aiven Sync

on:
  schedule:
    # Runs once a day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab
permissions:
  contents: read

jobs:
  backup_and_sync:
    runs-on: ubuntu-latest
    env:
      FILENAME: ""

    steps:
      - name: Install PostgreSQL 17 Client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> $GITHUB_PATH

      - name: Dump Database from Supabase
        env:
          SUPABASE_DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          # Generate filename with current date and time
          FILENAME="supabase_backup_$(date +'%Y-%m-%d_%H-%M-%S').sql"
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          
          # Dump ONLY the public schema, and ensure we drop tables before recreating them
          # --no-owner and --no-privileges ensure we don't try to assign roles that don't exist on Aiven
          pg_dump --schema=public --clean --if-exists --no-owner --no-privileges "$SUPABASE_DIRECT_URL" > "$FILENAME"

      - name: Restore to Aiven (Live Standby)
        env:
          AIVEN_DIRECT_URL: ${{ secrets.AIVEN_DIRECT_URL }}
        run: |
          # Push the clean dump straight into Aiven.
          # -v ON_ERROR_STOP=1 ensures the script fails immediately if Aiven rejects it
          psql -v ON_ERROR_STOP=1 "$AIVEN_DIRECT_URL" -f "$FILENAME"

      - name: Restore to Neon (Live Standby)
        env:
          NEON_DIRECT_URL: ${{ secrets.NEON_DIRECT_URL }}
        run: |
          # Push the clean dump straight into Neon.
          # -v ON_ERROR_STOP=1 ensures the script fails immediately if Neon rejects it
          psql -v ON_ERROR_STOP=1 "$NEON_DIRECT_URL" -f "$FILENAME"

      - name: Encrypt Backup Archive
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          # Encrypt the raw SQL file with military-grade AES-256
          # --batch and --yes prevent interactive prompts in the action
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSWORD" -o "$FILENAME.gpg" "$FILENAME"
          
          # Delete the unencrypted raw file immediately
          rm "$FILENAME"

      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILENAME }}-gpg
          path: ${{ env.FILENAME }}.gpg
          retention-days: 90
